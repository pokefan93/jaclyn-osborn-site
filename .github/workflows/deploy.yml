name: Validate Cloudflare site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
# Cloudflare Workers Builds owns production deployment. This workflow deliberately
# does not run the legacy workbook/Stripe sync or deploy SSR output to GitHub Pages.
